<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fast – falscher Weg</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f2e8;--ink:#1c2430;--accent:#d85d2f;--muted:#667085;--card:#fff}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(28,36,48,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(28,36,48,.035) 1px,transparent 1px),var(--bg);background-size:28px 28px;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    main{width:min(680px,100%);background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:10px 10px 0 var(--ink);padding:34px}
    .tag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
    h1{font-size:clamp(34px,8vw,58px);margin:22px 0 14px;line-height:1} p{font-size:clamp(18px,4vw,24px);line-height:1.5;margin:0}.hint{margin-top:28px;padding:16px 18px;border-left:5px solid var(--accent);background:#fff5ef;font-size:18px}.small{margin-top:22px;color:var(--muted);font-size:14px}
    @media (prefers-color-scheme:dark){:root{--bg:#11151b;--ink:#edf0f4;--card:#1b222c;--muted:#b6beca}.hint{background:#3a241d}}
  </style>
</head>
<body>
  <main>
    <span class="tag">Escape Game</span>
    <h1>Fast.</h1>
    <p>Du hast den Code richtig gelesen – aber vielleicht noch nicht richtig <strong>angesehen</strong>.</p>
    <div class="hint">Manchmal lohnt sich ein Blick aus einer anderen Perspektive.</div>
    <div class="small">Kein Login nötig. Einfach weiterdenken.</div>
  </main>
</body>
</html>
